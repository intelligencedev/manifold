name: Build Manifold Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label used in artifact names, for example v0.0.0-main.123"
        required: true
      target:
        description: "OS/architecture target to build"
        required: true
        default: darwin-arm64
        type: choice
        options:
          - darwin-arm64
          - darwin-amd64
          - linux-amd64
          - linux-arm64
          - windows-amd64
          - windows-arm64
          - all
      ref:
        description: "Optional branch, tag, or SHA to build"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      target:
        required: false
        type: string
        default: all
      ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  GO_VERSION: 1.26.3

jobs:
  select-targets:
    name: Select build targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            all)
              matrix='{"include":[{"target_os":"linux","target_arch":"amd64","runner":"ubuntu-24.04"},{"target_os":"linux","target_arch":"arm64","runner":"ubuntu-24.04-arm"},{"target_os":"darwin","target_arch":"amd64","runner":"macos-15-intel"},{"target_os":"darwin","target_arch":"arm64","runner":"macos-15"},{"target_os":"windows","target_arch":"amd64","runner":"windows-2022"},{"target_os":"windows","target_arch":"arm64","runner":"windows-11-arm"}]}'
              ;;
            linux-amd64)
              matrix='{"include":[{"target_os":"linux","target_arch":"amd64","runner":"ubuntu-24.04"}]}'
              ;;
            linux-arm64)
              matrix='{"include":[{"target_os":"linux","target_arch":"arm64","runner":"ubuntu-24.04-arm"}]}'
              ;;
            darwin-amd64)
              matrix='{"include":[{"target_os":"darwin","target_arch":"amd64","runner":"macos-15-intel"}]}'
              ;;
            darwin-arm64)
              matrix='{"include":[{"target_os":"darwin","target_arch":"arm64","runner":"macos-15"}]}'
              ;;
            windows-amd64)
              matrix='{"include":[{"target_os":"windows","target_arch":"amd64","runner":"windows-2022"}]}'
              ;;
            windows-arm64)
              matrix='{"include":[{"target_os":"windows","target_arch":"arm64","runner":"windows-11-arm"}]}'
              ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 1
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Manifold ${{ matrix.target_os }}/${{ matrix.target_arch }}
    needs: select-targets
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    steps:
      - name: Checkout
        if: ${{ inputs.ref == '' }}
        uses: actions/checkout@v4

      - name: Checkout ref
        if: ${{ inputs.ref != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Build frontend
        shell: bash
        run: make frontend

      - name: Build manifold binary
        shell: bash
        run: |
          mkdir -p dist/package
          ext=""
          if [[ "${{ matrix.target_os }}" == "windows" ]]; then ext=".exe"; fi
          CGO_ENABLED=0 GOOS="${{ matrix.target_os }}" GOARCH="${{ matrix.target_arch }}" \
            go build -tags "forge" -ldflags "-s -w" \
            -o "dist/package/manifold${ext}" ./cmd/agentd

      - name: Add release notes files
        shell: bash
        run: |
          touch dist/package/THIRD_PARTY_NOTICES.txt

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist/release
          archive="manifold-${{ inputs.version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}"
          if [[ "${{ matrix.target_os }}" == "windows" ]]; then
            (cd dist/package && zip -qr "../release/${archive}.zip" .)
            shasum -a 256 "dist/release/${archive}.zip" > "dist/release/${archive}.zip.sha256"
          else
            tar -czf "dist/release/${archive}.tar.gz" -C dist/package .
            shasum -a 256 "dist/release/${archive}.tar.gz" > "dist/release/${archive}.tar.gz.sha256"
          fi

      - name: Upload Manifold artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifold-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: |
            dist/release/manifold-${{ inputs.version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.tar.gz
            dist/release/manifold-${{ inputs.version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.zip
            dist/release/manifold-${{ inputs.version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.*.sha256
          if-no-files-found: error
