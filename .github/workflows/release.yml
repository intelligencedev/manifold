name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  validate-release:
    name: Validate main release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: [self-hosted, Linux, X64, cross-compile, target-darwin-arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
      head_sha: ${{ steps.version.outputs.head_sha }}
    steps:
      - id: version
        shell: bash
        env:
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          short_sha="${HEAD_SHA:0:12}"
          version="v0.0.0-main.${CI_RUN_NUMBER}.${short_sha}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"
          echo "Release commit: $HEAD_SHA"

  build-manifold-artifacts:
    needs: validate-release
    uses: ./.github/workflows/build-manifold-release.yml
    with:
      version: ${{ needs.validate-release.outputs.version }}
      target: all
      ref: ${{ needs.validate-release.outputs.head_sha }}
    secrets: inherit

  smoke-manifold-artifacts:
    needs:
      - validate-release
      - build-manifold-artifacts
    uses: ./.github/workflows/smoke-release-artifacts.yml
    with:
      version: ${{ needs.validate-release.outputs.version }}
      target: all
      artifact_run_id: ""
      ref: ${{ needs.validate-release.outputs.head_sha }}
    secrets: inherit

  create-github-release:
    needs:
      - validate-release
      - smoke-manifold-artifacts
    runs-on: [self-hosted, Linux, X64, cross-compile, target-darwin-arm64]
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate-release.outputs.version }}
      HEAD_SHA: ${{ needs.validate-release.outputs.head_sha }}
      CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: manifold-*
          path: dist/release
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail

          notes="Automated Manifold main build.

          Commit: ${HEAD_SHA}
          CI: ${CI_RUN_URL}"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/release/* --clobber
          else
            gh release create "$VERSION" dist/release/* \
              --target "$HEAD_SHA" \
              --title "$VERSION" \
              --notes "$notes" \
              --prerelease
          fi
