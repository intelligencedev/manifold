[project]
name = "supertonic-sidecar"
version = "0.1.0"
description = "HTTP sidecar that serves Supertonic TTS audio (OpenAI /v1/audio/speech shape) for Manifold and the Reachy Mini bot."
requires-python = ">=3.10"
dependencies = [
    "supertonic>=1.3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
supertonic-sidecar = "supertonic_sidecar.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["supertonic_sidecar"]
