name: Build Manifold Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
      publish_release:
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  GO_VERSION: 1.26.3

jobs:
  build:
    name: Manifold ${{ matrix.target_os }}/${{ matrix.target_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            target_arch: amd64
            runner: ubuntu-22.04
          - target_os: linux
            target_arch: arm64
            runner: ubuntu-22.04-arm
          - target_os: darwin
            target_arch: amd64
            runner: macos-13
          - target_os: darwin
            target_arch: arm64
            runner: macos-14
          - target_os: windows
            target_arch: amd64
            runner: windows-2022
          - target_os: windows
            target_arch: arm64
            runner: windows-2022-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Build frontend
        shell: bash
        run: make frontend

      - name: Build manifold binary
        shell: bash
        run: |
          mkdir -p dist/package
          ext=""
          if [[ "${{ matrix.target_os }}" == "windows" ]]; then ext=".exe"; fi
          GOOS="${{ matrix.target_os }}" GOARCH="${{ matrix.target_arch }}" \
            go build -tags "forge" -ldflags "-s -w" \
            -o "dist/package/manifold${ext}" ./cmd/agentd

      - name: Add release notes files
        shell: bash
        run: |
          touch dist/package/THIRD_PARTY_NOTICES.txt

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist/release
          archive="manifold-${{ inputs.version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}"
          if [[ "${{ matrix.target_os }}" == "windows" ]]; then
            (cd dist/package && zip -qr "../release/${archive}.zip" .)
            shasum -a 256 "dist/release/${archive}.zip" > "dist/release/${archive}.zip.sha256"
          else
            tar -czf "dist/release/${archive}.tar.gz" -C dist/package .
            shasum -a 256 "dist/release/${archive}.tar.gz" > "dist/release/${archive}.tar.gz.sha256"
          fi

      - name: Upload Manifold artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifold-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: |
            dist/release/manifold-${{ inputs.version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.tar.gz
            dist/release/manifold-${{ inputs.version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.zip
            dist/release/manifold-${{ inputs.version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.*.sha256
          if-no-files-found: error
