name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # default Go version for build job; tests use a matrix
  BUILD_GO_VERSION: 1.26.3

jobs:
  test:
    name: Test & Lint (Go matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.26.3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Ensure modules tidy
        run: go mod tidy

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:" && echo "$unformatted"
            exit 1
          fi

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check imports (goimports)
        run: |
          bad=$(goimports -l .)
          if [ -n "$bad" ]; then
            echo "goimports found files with import issues:" && echo "$bad"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $GOMODCACHE/bin v2.12.2 || true
          export PATH="$GOMODCACHE/bin:$PATH"
        env:
          GOMODCACHE: ${{ runner.temp }}

      - name: Run golangci-lint
        run: ${{ runner.temp }}/golangci-lint run --timeout=5m

      - name: Run tests (race, coverage)
        run: |
          go test -race -coverprofile=coverage.out ./...

      - name: Run Forge harness scenarios
        run: make test-forge-harness

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go-version }}.out
          path: coverage.out
