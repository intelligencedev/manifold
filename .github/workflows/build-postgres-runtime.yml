name: Build PostgreSQL Runtime

on:
  workflow_dispatch:
    inputs:
      pg_version:
        required: true
        default: "17.5"
      pgvector_version:
        required: true
        default: "0.8.2"
      postgis_version:
        required: true
        default: "3.6.2"
      pgrouting_version:
        required: true
        default: "4.0.1"
      upload_to_release:
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      release_tag:
        required: false
  workflow_call:
    inputs:
      pg_version:
        required: true
        type: string
      pgvector_version:
        required: true
        type: string
      postgis_version:
        required: true
        type: string
      pgrouting_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Runtime ${{ matrix.target_os }}/${{ matrix.target_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            target_arch: amd64
            runner: ubuntu-22.04
          - target_os: linux
            target_arch: arm64
            runner: ubuntu-22.04-arm
          - target_os: darwin
            target_arch: amd64
            runner: macos-13
          - target_os: darwin
            target_arch: arm64
            runner: macos-14
          - target_os: windows
            target_arch: amd64
            runner: windows-2022
          - target_os: windows
            target_arch: arm64
            runner: windows-2022-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare packaging tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y curl tar unzip zip zstd python3
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install zstd zip || true
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            choco install zstandard zip unzip -y
          fi

      - name: Build and smoke runtime bundle
        shell: bash
        run: |
          scripts/release/build-postgres-runtime.sh \
            --pg-version "${{ inputs.pg_version }}" \
            --pg-major 17 \
            --pgvector-version "${{ inputs.pgvector_version }}" \
            --postgis-version "${{ inputs.postgis_version }}" \
            --pgrouting-version "${{ inputs.pgrouting_version }}" \
            --target-os "${{ matrix.target_os }}" \
            --target-arch "${{ matrix.target_arch }}" \
            --output-dir dist/postgres-runtime

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-runtime-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: |
            dist/postgres-runtime/postgres-runtime-*-${{ matrix.target_os }}-${{ matrix.target_arch }}.tar.zst
            dist/postgres-runtime/postgres-runtime-*-${{ matrix.target_os }}-${{ matrix.target_arch }}.zip
            dist/postgres-runtime/postgres-runtime-*-${{ matrix.target_os }}-${{ matrix.target_arch }}.manifest.json
            dist/postgres-runtime/postgres-runtime-*-${{ matrix.target_os }}-${{ matrix.target_arch }}.*.sha256
            dist/postgres-runtime/runtime-smoke-*-${{ matrix.target_os }}-${{ matrix.target_arch }}.json
          if-no-files-found: error
